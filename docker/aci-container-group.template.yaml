# Template for the Azure Container Instances multi-container group.
# Placeholders (${...}) are substituted by deploy_azure.sh at deploy time —
# this file itself never contains real secrets and is safe to commit.
#
# Both containers share one network namespace in ACI (unlike separate Docker
# hosts) — that's why CHROMA_HOST is "localhost" here, not "chroma" like in
# docker-compose.yml. Same idea (app talks to a sibling Chroma container),
# different hostname convention because it's a different networking model.
apiVersion: 2021-10-01
location: germanywestcentral
name: support-triage-agent
properties:
  osType: Linux
  restartPolicy: OnFailure
  ipAddress:
    type: Public
    dnsNameLabel: ${DNS_LABEL}
    ports:
      - protocol: tcp
        port: 7860
  imageRegistryCredentials:
    - server: "${ACR_LOGIN_SERVER}"
      username: "${ACR_USERNAME}"
      password: "${ACR_PASSWORD}"
  containers:
    - name: chroma
      properties:
        image: chromadb/chroma:latest
        ports:
          - port: 8000
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0
    - name: app
      properties:
        image: ${ACR_LOGIN_SERVER}/support-triage-agent:latest
        ports:
          - port: 7860
        environmentVariables:
          - name: CHROMA_HOST
            value: localhost
          - name: CHROMA_PORT
            value: "8000"
          - name: PORT
            value: "7860"
          - name: OPENAI_API_KEY
            secureValue: ${OPENAI_API_KEY}
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
